    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    :root{
      --ink:#1B2D45; --paper:#E5F0FC; --teal:#0755AD; --teal-dark:#054487; --teal-light:#7FB6EA; --blue2:#087FC4; --surface:#DCEBFA; --green:#20C997;
      --clay:#BF360C; --clay-bg:#FDEBE3; --clay-bg-hover:#FAD8C8; --danger:#9B1C1C;
      --ochre:#D98E04; --ochre-bg:#FEF3D7; --ochre-text:#8F5C00;
      --sage:#0B7A5A; --sage-bg:#DDF6EE;
      --line:#D8E4F0; --muted:#5B6E86; --sub:#5B6E86; --body:#34495F;
      --chip:#DCEBFA; --sidebar-hover:rgba(255,255,255,.12); --sidebar-text:#DCEBFA;
      --shadow:0 1px 2px rgba(7,85,173,.05), 0 4px 14px rgba(38,59,86,.06);
    }
    *{ box-sizing:border-box; }
    body{ margin:0; }
    .font-display{ font-family:'Manrope','Inter',sans-serif; font-weight:600; }
    .font-mono{ font-family:'Inter',sans-serif; font-variant-numeric:tabular-nums; }

    .app-shell{ display:flex; height:100vh; background:var(--paper); font-family:'Inter',sans-serif; color:var(--ink); }

    /* Sidebar */
    .sidebar{ width:230px; background:var(--teal); display:flex; flex-direction:column; flex-shrink:0; }
    .sidebar-brand{ display:flex; align-items:center; gap:10px; padding:18px 16px; }
    .sidebar-brand-icon{ width:32px; height:32px; border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .sidebar-brand-title{ color:#fff; font-size:14px; line-height:1.3; font-family:'Manrope','Inter',sans-serif; font-weight:600; }
    .sidebar-brand-sub{ color:#CFE5FA; font-size:12px; font-family:'Inter',sans-serif; }
    .sidebar-nav{ flex:1; padding:0 8px; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
    .nav-item{ display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border-radius:10px; font-size:14px;
      color:var(--sidebar-text); background:transparent; border:none; cursor:pointer; text-align:left; transition:background .15s,color .15s; }
    .nav-item:hover{ background:var(--sidebar-hover); color:#fff; }
    .nav-item.active{ background:rgba(255,255,255,.2); color:#fff; font-weight:600; }
    .nav-item span.label{ flex:1; }
    .nav-badge{ font-family:'Inter',sans-serif; font-variant-numeric:tabular-nums; font-size:11px; padding:2px 7px; border-radius:999px; background:var(--clay); color:#fff; }
    .sidebar-footer{ padding:10px 8px 14px; }
    .logout-btn{ display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border-radius:8px; font-size:14px;
      color:var(--sidebar-text); background:transparent; border:none; cursor:pointer; text-align:left; transition:background .15s,color .15s; }
    .logout-btn:hover{ background:var(--sidebar-hover); color:#fff; }

    /* Main column */
    .main-col{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .topbar{ display:flex; align-items:center; gap:14px; padding:12px 24px; background:#fff; border-bottom:1px solid var(--line); box-shadow:var(--shadow); flex-shrink:0; }
    .search-box{ display:flex; align-items:center; gap:8px; background:var(--paper); border-radius:12px; padding:7px 12px; width:290px; }
    .search-box input{ background:transparent; border:none; outline:none; font-size:14px; flex:1; color:var(--ink); }
    .search-box input::placeholder{ color:var(--muted); }
    .icon-btn{ padding:7px; border-radius:8px; background:transparent; border:none; cursor:pointer; position:relative; display:flex; }
    .icon-btn:hover{ background:var(--paper); }
    .topbar-text{ font-size:12px; color:var(--muted); white-space:nowrap; }
    .divider-v{ width:1px; height:20px; background:var(--line); }
    .avatar{ width:32px; height:32px; border-radius:999px; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex-shrink:0; }
    .notif-dot{ position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:999px; background:var(--clay); color:#fff; font-size:9px; display:flex; align-items:center; justify-content:center; }
    .page-body{ flex:1; overflow-y:auto; padding:24px 28px; }

    /* Section header */
    .section-title{ font-size:26px; color:var(--ink); margin:0 0 4px 0; }
    .section-sub{ font-size:14px; color:var(--sub); margin:0; }

    /* Cards */
    .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
    .card-title{ font-size:14px; font-weight:600; letter-spacing:.005em; color:var(--ink); margin-bottom:10px; display:flex; align-items:center; gap:6px; }

    /* KPI */
    .kpi-card{ text-align:left; background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; cursor:pointer; box-shadow:var(--shadow); transition:box-shadow .15s, border-color .15s, transform .15s; position:relative; }
    .kpi-card:hover{ box-shadow:0 6px 20px rgba(7,85,173,.14); border-color:#B9D3EE; }
    .kpi-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .kpi-icon{ width:32px; height:32px; border-radius:10px; background:var(--surface); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .kpi-label{ font-size:12px; letter-spacing:.01em; color:var(--sub); font-weight:600; }
    .kpi-value-row{ margin-top:8px; display:flex; align-items:baseline; gap:6px; }
    .kpi-value{ font-family:'Inter',sans-serif; font-variant-numeric:tabular-nums; font-size:30px; font-weight:700; color:var(--teal); }
    .kpi-sub{ font-size:12px; color:var(--muted); }

    /* Badges (risk) */
    .badge{ display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600; white-space:nowrap; }
    .badge-high{ background:var(--clay-bg); color:var(--clay); }
    .badge-medium{ background:var(--ochre-bg); color:var(--ochre-text); }
    .badge-low{ background:var(--sage-bg); color:var(--sage); }

    /* Pills */
    .pill{ font-size:12px; padding:3px 9px; border-radius:999px; font-weight:600; display:inline-block; }
    .pill-neutral{ background:var(--chip); color:var(--body); }
    .pill-good{ background:var(--sage-bg); color:var(--sage); }
    .pill-warn{ background:var(--ochre-bg); color:var(--ochre-text); }
    .pill-bad{ background:var(--clay-bg); color:var(--clay); }

    /* Buttons */
    .btn-primary{ background:var(--teal); color:#fff; border:none; border-radius:10px; padding:8px 16px; font-size:14px; font-weight:600; cursor:pointer; transition:background .15s; }
    .btn-primary:hover{ background:var(--teal-dark); }
    .btn-primary.sm{ padding:6px 12px; font-size:12px; }
    .btn-outline{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; color:var(--body); transition:background .15s; }
    .btn-outline:hover{ background:var(--paper); }
    .btn-danger{ background:var(--clay-bg); color:var(--clay); border:none; border-radius:10px; padding:8px 16px; font-size:14px; font-weight:600; cursor:pointer; transition:background .15s; }
    .btn-danger:hover{ background:var(--clay-bg-hover); }
    .btn-danger.sm{ padding:6px 12px; font-size:12px; }
    .icon-circle-btn{ padding:8px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; display:flex; }
    .icon-circle-btn:hover{ background:var(--paper); }

    /* Table */
    .data-table{ width:100%; font-size:14px; border-collapse:collapse; }
    .data-table thead th{ text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); padding:12px; border-bottom:1px solid var(--line); font-weight:600; background:#F5F9FE; }
    .data-table tbody td{ padding:12px; border-bottom:1px solid #EAF1F9; color:var(--body); }
    .data-table tbody tr:last-child td{ border-bottom:none; }
    .data-table tbody tr.clickable{ cursor:pointer; transition:background .15s; }
    .data-table tbody tr.clickable:hover{ background:var(--paper); }
    .name-cell{ font-weight:600; color:var(--ink); }

    /* Filters/inputs */
    .select-input, .text-input{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:14px; color:var(--ink); outline:none; }
    .search-filter{ display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 12px; flex:1; }
    .search-filter input{ border:none; outline:none; font-size:14px; flex:1; background:transparent; }

    /* Tabs */
    .tab-row{ display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:16px; }
    .tab{ padding:9px 14px; font-size:14px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none; cursor:pointer; text-transform:capitalize; margin-bottom:-1px; }
    .tab.active{ color:var(--teal); border-bottom-color:var(--teal); }

    /* Nav / risk-pulse */
    .stat-box{ background:var(--surface); border-radius:12px; padding:8px; text-align:center; }
    .stat-box .stat-label{ font-size:12px; color:var(--muted); }
    .stat-box .stat-value{ font-family:'Inter',sans-serif; font-variant-numeric:tabular-nums; font-size:16px; font-weight:600; color:var(--teal); }

    /* Login */
    .login-page{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--teal); font-family:'Inter',sans-serif; }
    .login-card{ background:#fff; border-radius:18px; padding:32px; width:380px; }
    .login-brand{ display:flex; align-items:center; gap:10px; margin-bottom:24px; }
    .login-brand-icon{ width:36px; height:36px; border-radius:8px; background:var(--teal); display:flex; align-items:center; justify-content:center; }
    .login-title{ font-size:17px; color:var(--ink); font-family:'Manrope','Inter',sans-serif; font-weight:600; }
    .login-sub{ font-size:12px; color:var(--muted); }
    .login-label{ font-size:12px; font-weight:600; color:var(--sub); display:block; margin-bottom:4px; }
    .login-input{ width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px; margin-bottom:14px; outline:none; color:var(--ink); }
    .login-input:focus{ border-color:var(--teal); }
    .login-btn{ width:100%; background:var(--teal); color:#fff; border:none; border-radius:8px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; transition:background .15s; box-shadow:0 2px 8px rgba(27,75,74,0.35); }
    .login-btn:hover{ background:var(--teal-dark); }
    .login-footer{ font-size:12px; color:var(--muted); text-align:center; margin-top:16px; }

    /* Chat (AI assistant) */
    .chat-window{ display:flex; flex-direction:column; }
    .chat-scroll{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
    .chat-row{ display:flex; }
    .chat-row.user{ justify-content:flex-end; }
    .chat-bubble{ max-width:75%; border-radius:12px; padding:9px 12px; font-size:14px; }
    .chat-bubble.ai{ background:var(--paper); color:var(--ink); }
    .chat-bubble.user{ background:var(--teal); color:#fff; }
    .suggestion-chip{ font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; }
    .suggestion-chip:hover{ background:var(--paper); }

    .notif-row{ width:100%; text-align:left; background:#fff; border-radius:14px; border:1px solid var(--line); padding:12px; display:flex; align-items:flex-start; gap:12px; cursor:pointer; transition:background .15s; }
    .notif-row:hover{ background:var(--paper); }

    .village-card{ text-align:left; background:#fff; border-radius:16px; box-shadow:var(--shadow); padding:14px; cursor:pointer; transition:box-shadow .15s; }
    .village-card:hover{ box-shadow:0 6px 20px rgba(7,85,173,.14); }

    .menu-btn, .close-btn, .sidebar-overlay{ display:none; }
    .close-btn{ margin-left:auto; padding:6px; border-radius:8px; border:none; background:var(--sidebar-hover); color:#fff; cursor:pointer; }
    @media (max-width: 768px){
      .sidebar{ position:fixed; top:0; left:0; bottom:0; z-index:50; transform:translateX(-100%); transition:transform .25s ease; width:260px; }
      .sidebar.open{ transform:translateX(0); box-shadow:4px 0 24px rgba(0,0,0,.3); }
      .menu-btn{ display:flex; }
      .close-btn{ display:flex; align-items:center; justify-content:center; }
      .sidebar-overlay.show{ display:block; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; }
      .topbar{ padding:10px 12px; gap:8px; }
      .search-box{ width:auto; flex:1; min-width:0; }
      .topbar-text{ display:none; }
      .divider-v{ display:none; }
      .page-body{ padding:16px 12px; }
      .page-body div[style*="grid-template-columns"]{ grid-template-columns:1fr !important; }
      .page-body div[style*="grid-column"]{ grid-column:auto !important; }
      .page-body .kpi-grid{ grid-template-columns:1fr 1fr !important; }
      .card{ overflow-x:auto; }
      .kpi-grid{ grid-template-columns:1fr 1fr !important; }
      .login-card{ width:92%; padding:24px; }
    }
    :focus-visible{ outline:2px solid var(--blue2); outline-offset:2px; border-radius:6px; }
    button:disabled, input:disabled{ opacity:.5; cursor:not-allowed; }
    body{ font-family:'Inter',sans-serif; }
    .progress-track{ display:flex; gap:1px; height:8px; border-radius:999px; overflow:hidden; }
